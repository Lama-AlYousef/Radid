name: radid
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true

  image_path: "assets/icon/appIcon.png"

  min_sdk_android: 21

  # Android Adaptive Icons
  adaptive_icon_background: "#DBEDDF"
  adaptive_icon_foreground: "assets/icon/appIconForeground.png"

  web:
    generate: true
    image_path: "assets/icon/appIcon.png"
    background_color: "#DBEDDF"
    theme_color: "#335634"

  windows:
    generate: true
    image_path: "assets/icon/appIcon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/appIcon.png"

  linux:
    generate: true
    image_path: "assets/icon/appIcon.png"

flutter:
  uses-material-design: true
